
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — Routine</title>
<!-- Pas de meta robots pour garder discret, pas indexé -->
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0F1117; --surface:#1A1D27; --surface2:#22263A; --border:#2E3347;
    --accent:#6C63FF; --accent2:#06D6A0; --warn:#FF8C42;
    --text:#F0F0F8; --muted:#7A7D99;
    --morning:#FF8C42; --midday:#FFD166; --afternoon:#06D6A0; --evening:#118AB2; --night:#9B8EF0;
    --radius:14px; --shadow:0 4px 24px rgba(0,0,0,0.4);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);font-family:'Nunito Sans',sans-serif;color:var(--text);min-height:100vh;}

  /* ── LOGIN ── */
  #loginScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:100%;max-width:380px;text-align:center;box-shadow:var(--shadow);animation:fadeUp 0.5s ease both;}
  .login-card h2{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.6rem;margin-bottom:8px;}
  .login-card p{color:var(--muted);font-size:0.9rem;margin-bottom:28px;}
  .login-card input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:13px 16px;color:var(--text);font-family:'Nunito Sans',sans-serif;font-size:1rem;margin-bottom:16px;outline:none;transition:border-color 0.2s;}
  .login-card input:focus{border-color:var(--accent);}
  .login-card input::placeholder{color:var(--muted);}
  .btn-login{width:100%;background:var(--accent);color:white;border:none;border-radius:10px;padding:14px;font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;cursor:pointer;transition:opacity 0.2s,transform 0.15s;}
  .btn-login:hover{opacity:0.88;transform:translateY(-1px);}
  .login-error{color:#FF6B6B;font-size:0.85rem;margin-top:10px;display:none;font-weight:600;}

  /* ── TOPBAR ── */
  #adminScreen{display:none;}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:15px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .topbar-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.1rem;display:flex;align-items:center;gap:8px;}
  .topbar-title span{color:var(--accent);}
  .topbar-actions{display:flex;gap:8px;}
  .btn-sm{font-family:'Nunito',sans-serif;font-weight:700;font-size:0.8rem;padding:7px 16px;border-radius:999px;border:none;cursor:pointer;transition:all 0.15s;}
  .btn-outline{background:transparent;color:var(--muted);border:1.5px solid var(--border);}
  .btn-outline:hover{border-color:var(--text);color:var(--text);}
  .btn-danger{background:rgba(255,100,100,0.1);color:#FF6B6B;border:1.5px solid rgba(255,100,100,0.2);}
  .btn-danger:hover{background:rgba(255,100,100,0.2);}

  /* ── BODY ── */
  .admin-body{padding:28px 24px 60px;max-width:980px;margin:0 auto;}

  /* ── STATS ── */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:32px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
  .stat-label{font-size:0.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
  .stat-value{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.9rem;line-height:1;}
  .green{color:var(--accent2);} .orange{color:var(--warn);} .purple{color:var(--accent);}

  /* ── SECTION TITLE ── */
  .sec-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:0.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .sec-title::after{content:'';flex:1;height:1px;background:var(--border);}

  /* ── CALENDAR ── */
  .cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .cal-nav-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:1rem;transition:all 0.15s;display:flex;align-items:center;justify-content:center;}
  .cal-nav-btn:hover{border-color:var(--accent);color:var(--accent);}
  .cal-month-label{font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;}
  .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:32px;}
  .cal-day-header{text-align:center;font-size:0.68rem;font-weight:700;color:var(--muted);padding:4px 0;text-transform:uppercase;}
  .cal-cell{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1.5px solid transparent;transition:all 0.15s;font-family:'Nunito',sans-serif;font-weight:700;font-size:0.78rem;}
  .cal-cell:hover:not(.empty){border-color:var(--accent);}
  .cal-cell.empty{cursor:default;}
  .cal-cell.no-data{background:var(--surface2);color:var(--muted);}
  .cal-cell.today{box-shadow:0 0 0 2px var(--accent);}
  .cal-cell .cal-pct{font-size:0.6rem;font-weight:600;margin-top:1px;}
  .cal-cell.selected{box-shadow:0 0 0 2px white;}

  /* ── HISTORY LIST ── */
  .history-list{display:flex;flex-direction:column;gap:8px;margin-bottom:28px;}
  .history-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all 0.18s;}
  .history-item:hover{border-color:var(--accent);transform:translateX(3px);}
  .history-item.selected{border-color:var(--accent);background:var(--surface2);}
  .hi-date{font-family:'Nunito',sans-serif;font-weight:800;font-size:0.92rem;min-width:200px;}
  .hi-bar-wrap{flex:1;}
  .hi-bar-track{height:7px;background:var(--border);border-radius:999px;overflow:hidden;}
  .hi-bar-fill{height:100%;border-radius:999px;transition:width 0.4s;}
  .hi-pct{font-family:'Nunito',sans-serif;font-weight:800;font-size:0.88rem;min-width:40px;text-align:right;}
  .hi-count{font-size:0.75rem;color:var(--muted);margin-top:3px;}
  .hi-badge{font-size:0.72rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;}

  /* ── DETAIL ── */
  #detailPanel{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;display:none;animation:fadeUp 0.3s ease both;}
  .detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  .detail-header h3{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.1rem;}
  .detail-close{background:var(--surface2);border:none;color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:0.95rem;transition:all 0.15s;}
  .detail-close:hover{color:var(--text);}
  .detail-sections{display:flex;flex-direction:column;gap:16px;}
  .detail-sec-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.85rem;}
  .detail-tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;}
  .detail-task{background:var(--surface2);border-radius:9px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:0.82rem;}
  .detail-task .ck{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:0.7rem;flex-shrink:0;}
  .detail-task.done .ck{background:#4CAF50;color:white;}
  .detail-task.missed .ck{background:var(--border);color:var(--muted);}
  .detail-task.done .tn{color:var(--text);}
  .detail-task.missed .tn{color:var(--muted);}

  /* ── EMPTY ── */
  .empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-state .big{font-size:3rem;margin-bottom:12px;}

  /* ── CHANGE PASSWORD ── */
  .pwd-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:32px;}
  .pwd-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:12px;}
  .pwd-row input{flex:1;min-width:160px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-family:'Nunito Sans',sans-serif;font-size:0.9rem;outline:none;transition:border-color 0.2s;}
  .pwd-row input:focus{border-color:var(--accent);}
  .pwd-row input::placeholder{color:var(--muted);}
  .btn-save-pwd{background:var(--accent);color:white;border:none;border-radius:10px;padding:10px 20px;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.85rem;cursor:pointer;transition:opacity 0.2s;}
  .btn-save-pwd:hover{opacity:0.88;}
  .pwd-feedback{font-size:0.8rem;margin-top:8px;font-weight:600;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

  @media(max-width:580px){
    .admin-body{padding:16px 12px 60px;}
    .topbar{padding:12px 14px;}
    .hi-date{min-width:auto;font-size:0.82rem;}
    .hi-badge{display:none;}
    .detail-tasks{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="loginScreen">
  <div class="login-card">
    <div style="font-size:2.5rem;margin-bottom:12px">🔐</div>
    <h2>Administration</h2>
    <p>Accès réservé</p>
    <input type="password" id="pwInput" placeholder="Mot de passe" autocomplete="off">
    <button class="btn-login" onclick="tryLogin()">Connexion</button>
    <div class="login-error" id="loginError">Mot de passe incorrect</div>
  </div>
</div>

<!-- ══ ADMIN ══ -->
<div id="adminScreen">
  <div class="topbar">
    <div class="topbar-title">📊 <span>Routine</span> — Administration</div>
    <div class="topbar-actions">
      <button class="btn-sm btn-danger" onclick="logout()">Déconnexion</button>
    </div>
  </div>

  <div class="admin-body">

    <!-- Stats -->
    <div class="stats-grid" id="statsGrid"></div>

    <!-- Changer mot de passe -->
    <div class="sec-title">⚙️ Paramètres</div>
    <div class="pwd-section">
      <div style="font-family:'Nunito',sans-serif;font-weight:800;font-size:0.95rem;">Changer le mot de passe admin</div>
      <div class="pwd-row">
        <input type="password" id="newPwd1" placeholder="Nouveau mot de passe" autocomplete="new-password">
        <input type="password" id="newPwd2" placeholder="Confirmer" autocomplete="new-password">
        <button class="btn-save-pwd" onclick="changePassword()">Enregistrer</button>
      </div>
      <div class="pwd-feedback" id="pwdFeedback"></div>
    </div>

    <!-- Calendrier -->
    <div class="sec-title">📅 Vue calendrier</div>
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
      <div class="cal-month-label" id="calMonthLabel"></div>
      <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>

    <!-- Historique -->
    <div class="sec-title">📋 Historique des journées</div>
    <div class="history-list" id="historyList"></div>

    <!-- Détail -->
    <div id="detailPanel">
      <div class="detail-header">
        <h3 id="detailTitle"></h3>
        <button class="detail-close" onclick="closeDetail()">✕</button>
      </div>
      <div class="detail-sections" id="detailContent"></div>
    </div>

  </div>
</div>

<script>
// ── Données tâches (miroir de index.html) ──
const TASKS_DATA = [
  { id:"morning",   label:"Matin",       icon:"🌅", color:"#FF8C42", tasks:["Se lever","Hygiène personnelle","S'habiller","Petit-déjeuner","Médicaments / vitamines","Préparer son sac"]},
  { id:"midday",    label:"Midi",        icon:"☀️", color:"#FFD166", tasks:["Repas du midi","Brossage de dents","Marche ou pause dehors","Moment calme"]},
  { id:"afternoon", label:"Après-midi",  icon:"🌤️", color:"#06D6A0", tasks:["Activité principale","Boire de l'eau","Loisir choisi","Contact social"]},
  { id:"evening",   label:"Soirée",      icon:"🌆", color:"#118AB2", tasks:["Préparer le souper","Souper","Petite tâche ménagère","Activité de décompression","Journal du jour"]},
  { id:"night",     label:"Nuit",        icon:"🌙", color:"#9B8EF0", tasks:["Réduire les écrans","Routine du soir","Préparer demain","Lecture ou musique calme","Au lit à l'heure prévue"]}
];
const TOTAL = TASKS_DATA.reduce((a,s)=>a+s.tasks.length, 0);

const HISTORY_KEY  = 'routine_history_v2';
const ADMIN_PWD_KEY = 'routine_admin_pwd';
const SESSION_KEY  = 'routine_admin_session';

const DAYS_LONG  = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const DAYS_SHORT = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const MONTHS_FR  = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MONTHS_LOW = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

let calViewDate = new Date(); // mois affiché dans le calendrier

// ── Mot de passe (stocké en localStorage, modifiable) ──
function getAdminPwd() {
  return localStorage.getItem(ADMIN_PWD_KEY) || 'admin123';
}

// ── Auth ──
function isLoggedIn() {
  return sessionStorage.getItem(SESSION_KEY) === '1';
}
function tryLogin() {
  const v = document.getElementById('pwInput').value;
  if (v === getAdminPwd()) {
    sessionStorage.setItem(SESSION_KEY, '1');
    document.getElementById('loginScreen').style.display  = 'none';
    document.getElementById('adminScreen').style.display  = 'block';
    buildAdmin();
  } else {
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}
function logout() {
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById('adminScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('pwInput').value = '';
  document.getElementById('loginError').style.display = 'none';
}

// Si déjà connecté dans cette session, afficher directement
if (isLoggedIn()) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminScreen').style.display = 'block';
  document.addEventListener('DOMContentLoaded', buildAdmin);
}

// ── Données ──
function getHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || {}; } catch { return {}; }
}
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function enrichEntry(e) {
  const done = Object.values(e.tasks||{}).filter(Boolean).length;
  return { ...e, done, total:TOTAL, pct:Math.round((done/TOTAL)*100) };
}

// ── Build admin ──
function buildAdmin() {
  const history = getHistory();
  const entries = Object.values(history).map(enrichEntry).sort((a,b)=>b.date.localeCompare(a.date));
  buildStats(entries);
  buildCalendar(history);
  buildHistoryList(entries);
}

// ── Stats ──
function buildStats(entries) {
  if (!entries.length) {
    document.getElementById('statsGrid').innerHTML =
      `<div class="stat-card"><div class="stat-label">Jours enregistrés</div><div class="stat-value purple">0</div></div>`;
    return;
  }
  const avg     = Math.round(entries.reduce((a,e)=>a+e.pct,0)/entries.length);
  const perfect = entries.filter(e=>e.pct===100).length;
  const streak  = calcStreak(entries);
  const todayE  = entries.find(e=>e.date===todayKey());
  const todayPct = todayE ? todayE.pct : 0;
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-label">Jours enregistrés</div><div class="stat-value purple">${entries.length}</div></div>
    <div class="stat-card"><div class="stat-label">Moyenne</div><div class="stat-value orange">${avg}%</div></div>
    <div class="stat-card"><div class="stat-label">Journées parfaites</div><div class="stat-value green">${perfect}</div></div>
    <div class="stat-card"><div class="stat-label">Série actuelle</div><div class="stat-value purple">${streak} 🔥</div></div>
    <div class="stat-card"><div class="stat-label">Aujourd'hui</div><div class="stat-value ${todayPct===100?'green':todayPct>50?'orange':'purple'}">${todayPct}%</div></div>`;
}
function calcStreak(entries) {
  let streak=0, d=new Date();
  for (let i=0;i<366;i++) {
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const e=entries.find(x=>x.date===key);
    if (e && e.pct>0) { streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}

// ── Calendrier ──
function changeMonth(dir) {
  calViewDate.setMonth(calViewDate.getMonth()+dir);
  buildCalendar(getHistory());
}
function buildCalendar(history) {
  const yr=calViewDate.getFullYear(), mo=calViewDate.getMonth();
  document.getElementById('calMonthLabel').textContent = `${MONTHS_FR[mo]} ${yr}`;
  const firstDay=new Date(yr,mo,1).getDay();
  const daysInMonth=new Date(yr,mo+1,0).getDate();
  const todayD=new Date(), todayStr=todayKey();
  let html=DAYS_SHORT.map(d=>`<div class="cal-day-header">${d}</div>`).join('');
  for(let i=0;i<firstDay;i++) html+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const key=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const e=history[key];
    const isToday=key===todayStr;
    if(e){
      const done=Object.values(e.tasks||{}).filter(Boolean).length;
      const pct=Math.round((done/TOTAL)*100);
      const c=pct===100?'#06D6A0':pct>=70?'#FFD166':pct>=30?'#FF8C42':'#FF6B6B';
      html+=`<div class="cal-cell has-data${isToday?' today':''}" style="background:${c}22;border-color:${c}44" onclick="showDetail('${key}')" title="${pct}%">
        ${d}<div class="cal-pct" style="color:${c}">${pct}%</div></div>`;
    } else {
      html+=`<div class="cal-cell no-data${isToday?' today':''}">${d}</div>`;
    }
  }
  document.getElementById('calendarGrid').innerHTML=html;
}

// ── Historique ──
function buildHistoryList(entries) {
  if(!entries.length){
    document.getElementById('historyList').innerHTML=`<div class="empty-state"><div class="big">📭</div><p>Aucune journée enregistrée pour le moment.</p></div>`;
    return;
  }
  document.getElementById('historyList').innerHTML=entries.map(e=>{
    const c=e.pct===100?'#06D6A0':e.pct>=70?'#FFD166':e.pct>=30?'#FF8C42':'#FF6B6B';
    const badge=e.pct===100?'🏆 Parfaite':e.pct>=70?'👍 Bonne':e.pct>=30?'🌱 Partielle':'⚠️ Faible';
    const d=new Date(e.date+'T12:00:00');
    const lbl=`${DAYS_LONG[d.getDay()]} ${d.getDate()} ${MONTHS_LOW[d.getMonth()]} ${d.getFullYear()}`;
    const isToday=e.date===todayKey();
    return `<div class="history-item" id="hi-${e.date}" onclick="showDetail('${e.date}')">
      <div><div class="hi-date">${isToday?'📍 ':''}${lbl}</div><div class="hi-count">${e.done} / ${TOTAL} tâches</div></div>
      <div class="hi-bar-wrap"><div class="hi-bar-track"><div class="hi-bar-fill" style="width:${e.pct}%;background:${c}"></div></div></div>
      <div class="hi-pct" style="color:${c}">${e.pct}%</div>
      <div class="hi-badge" style="background:${c}22;color:${c}">${badge}</div>
    </div>`;
  }).join('');
}

// ── Détail ──
function showDetail(dateKey){
  const history=getHistory(), e=history[dateKey];
  if(!e)return;
  document.querySelectorAll('.history-item').forEach(el=>el.classList.remove('selected'));
  document.querySelectorAll('.cal-cell').forEach(el=>el.classList.remove('selected'));
  const hi=document.getElementById('hi-'+dateKey);
  if(hi){hi.classList.add('selected');hi.scrollIntoView({behavior:'smooth',block:'nearest'});}
  const d=new Date(dateKey+'T12:00:00');
  const lbl=`${DAYS_LONG[d.getDay()]} ${d.getDate()} ${MONTHS_LOW[d.getMonth()]} ${d.getFullYear()}`;
  const done=Object.values(e.tasks||{}).filter(Boolean).length;
  const pct=Math.round((done/TOTAL)*100);
  const c=pct===100?'#06D6A0':pct>=70?'#FFD166':'#FF8C42';
  document.getElementById('detailTitle').innerHTML=`${lbl} — <span style="color:${c}">${pct}%</span>`;
  let html='';
  TASKS_DATA.forEach(section=>{
    html+=`<div><div class="detail-sec-header" style="color:${section.color}">${section.icon} ${section.label}</div><div class="detail-tasks">`;
    section.tasks.forEach((tl,i)=>{
      const key=`${section.id}_${i}`;
      const isDone=!!(e.tasks||{})[key];
      html+=`<div class="detail-task ${isDone?'done':'missed'}"><div class="ck">${isDone?'✓':'–'}</div><div class="tn">${tl}</div></div>`;
    });
    html+=`</div></div>`;
  });
  if(e.savedAt){
    const sd=new Date(e.savedAt);
    html+=`<div style="margin-top:14px;font-size:0.75rem;color:var(--muted)">💾 Sauvegardé le ${sd.toLocaleDateString('fr-CA')} à ${sd.toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'})}</div>`;
  }
  document.getElementById('detailContent').innerHTML=html;
  const panel=document.getElementById('detailPanel');
  panel.style.display='block';
  setTimeout(()=>panel.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
}
function closeDetail(){
  document.getElementById('detailPanel').style.display='none';
  document.querySelectorAll('.history-item, .cal-cell').forEach(el=>el.classList.remove('selected'));
}

// ── Changer mot de passe ──
function changePassword(){
  const p1=document.getElementById('newPwd1').value.trim();
  const p2=document.getElementById('newPwd2').value.trim();
  const fb=document.getElementById('pwdFeedback');
  if(!p1){fb.style.color='#FF6B6B';fb.textContent='Le mot de passe ne peut pas être vide.';return;}
  if(p1.length<6){fb.style.color='#FF6B6B';fb.textContent='Minimum 6 caractères.';return;}
  if(p1!==p2){fb.style.color='#FF6B6B';fb.textContent='Les deux mots de passe ne correspondent pas.';return;}
  localStorage.setItem(ADMIN_PWD_KEY, p1);
  document.getElementById('newPwd1').value='';
  document.getElementById('newPwd2').value='';
  fb.style.color='#06D6A0';
  fb.textContent='✅ Mot de passe mis à jour !';
  setTimeout(()=>fb.textContent='', 3000);
}

// ── Enter key ──
document.getElementById('pwInput').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
</script>
